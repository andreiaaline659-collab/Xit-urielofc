
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URIEL XIT OFC</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030005;color:white;font-family:Arial,sans-serif;
 background-image:
 radial-gradient(circle at 12% 20%,#a000ff 1px,transparent 3px),
 radial-gradient(circle at 80% 35%,#a000ff 1px,transparent 3px),
 radial-gradient(circle at 35% 70%,#7900c9 1px,transparent 3px),
 radial-gradient(circle at 90% 85%,#a000ff 1px,transparent 3px);
 background-size:130px 150px;
}
header{
 display:flex;align-items:center;justify-content:space-between;
 padding:15px;border-bottom:2px solid #9400ff;
 background:#08050c;gap:10px;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:19px}
.logo-icon{
 width:43px;height:43px;border-radius:50%;
 background:linear-gradient(135deg,#a000ff,#35005b);
 display:grid;place-items:center;font-size:23px;
 box-shadow:0 0 15px #a000ff;
}
.actions{display:flex;align-items:center;gap:10px}
.search,.login{
 border:1px solid #9c00ff;border-radius:12px;
 padding:12px;color:white;background:#170020;font-size:15px
}
.login{background:#7900d9;font-weight:bold}
main{max-width:900px;margin:auto;padding:20px 15px}
.support{text-align:center;margin:8px 0 38px}
.support a{
 display:inline-block;padding:18px 42px;border-radius:22px;
 color:#09000e;background:linear-gradient(135deg,#c000ff,#7900e8);
 text-decoration:none;font-weight:bold;font-size:20px;
 box-shadow:0 0 25px #a000ff
}
h2{font-size:27px;font-weight:400;margin:0 0 35px}
h2:after{
 content:"";display:block;width:70%;height:2px;
 background:#9900e9;margin-top:15px
}
.products{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 18px
}
.card{
 overflow:hidden;border:1px solid #b000ff;border-radius:20px;
 background:#080609;box-shadow:0 0 8px #500078
}
.banner{
 height:145px;background:linear-gradient(130deg,#260000,#a00000,#160016);
 display:flex;flex-direction:column;justify-content:center;
 align-items:center;text-align:center;padding:10px;
 border-bottom:2px solid #a000ff;
}
.banner strong{font-size:25px;font-style:italic;text-shadow:2px 2px #000}
.banner span{font-size:19px;color:#ff3131;font-weight:bold}
.banner small{margin-top:12px;color:#ffd5d5}
.product-image{
 width:100%;height:180px;object-fit:cover;
 border-bottom:2px solid #a000ff;display:block;
}
.info{padding:12px}
.name{font-size:18px;line-height:1.35;min-height:48px}
.description{color:#bbb;font-size:14px;margin-top:8px}
.old{color:#aaa;text-decoration:line-through;margin-top:12px;font-size:13px}
.discount{color:#00ed9b;background:#00291d;padding:4px 7px;border-radius:7px;margin-left:6px;font-size:12px}
.price{font-size:20px;margin-top:7px;font-weight:bold}
.pix{color:#bbb;font-size:13px;margin-top:5px}
.buttons{display:flex;gap:8px;margin-top:15px}
.buy,.download{
 border:0;border-radius:12px;background:linear-gradient(90deg,#7900df,#a000ff);
 color:#09000d;font-weight:bold;font-size:16px;padding:15px 5px;
}
.buy{flex:1}
.download{width:53px;color:white;font-size:22px}
.status-message{
 text-align:center;padding:25px;color:#ddd;grid-column:1/-1;
}
footer{text-align:center;color:#aaa;padding:35px 10px}
@media(max-width:380px){
 .logo{font-size:15px}.search{padding:10px}
 .banner{height:120px}.banner strong{font-size:20px}
 .name{font-size:15px}.info{padding:9px}
 .buy{font-size:14px}
 .price{font-size:18px}
}
</style>
</head>

<body>
<header>
 <div class="logo">
  <div class="logo-icon">✦</div>
  <span>URIEL XIT OFC</span>
 </div>
 <div class="actions">
  <button class="search" onclick="alert('Pesquisa em breve!')">⌕</button>
  <button class="login" onclick="alert('Área de login em breve!')">Entrar</button>
 </div>
</header>

<main>
 <div class="support">
  <a href="#" onclick="alert('Em breve vamos adicionar o contato de suporte!');return false">➤ &nbsp; Suporte</a>
 </div>

 <h2>PROXY ANDROID KWAI</h2>

 <section class="products" id="products">
  <div class="status-message">Carregando produtos...</div>
 </section>
</main>

<footer>© 2026 URIEL XIT OFC — Todos os direitos reservados.</footer>

<script>
const SUPABASE_URL = 'https://uvmlovadmbyiuvjogepv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4eUg8dwrnmVZCcCQiEANvA_DgXwvOST';

const PIX_URL = 'https://nubank.com.br/cobrar/3d51nu/6b099831-ee8a-412b-8c7b-4e7ea8e34379';

const supabaseClient = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

function escapeHTML(value){
 return String(value ?? '').replace(/[&<>"']/g, char => ({
  '&':'&amp;','<':'&lt;','>':'&gt;',
  '"':'&quot;',"'":'&#39;'
 }[char]));
}

function formatPrice(value){
 return Number(value).toLocaleString('pt-BR',{
  style:'currency',currency:'BRL'
 });
}

function openPix(){
 window.location.href = PIX_URL;
}

function renderProduct(product){
 const price = Number(product.price);
 const promo = product.promo_price == null ? null : Number(product.promo_price);

 const hasPromo = promo !== null && promo > 0 && promo < price;
 const name = escapeHTML(product.name);
 const description = escapeHTML(product.description);

 const image = product.image_url
  ? `<img class="product-image" src="${escapeHTML(product.image_url)}" alt="${name}" onerror="this.style.display='none'">`
  : `<div class="banner"><strong>${name}</strong><span>ACESSO DIGITAL</span><small>ANDROID • PRODUTO DIGITAL</small></div>`;

 const oldPrice = hasPromo
  ? `<div class="old">${formatPrice(price)} <span class="discount">↓ ${Math.round((1-promo/price)*100)}%</span></div>`
  : '';

 const displayedPrice = hasPromo ? promo : price;

 return `
 <article class="card">
  ${image}
  <div class="info">
   <div class="name">${name}</div>
   ${description ? `<div class="description">${description}</div>` : ''}
   ${oldPrice}
   <div class="price">${formatPrice(displayedPrice)}</div>
   <div class="pix">À vista no PIX</div>
   <div class="buttons">
    <button class="buy" onclick="openPix()">Comprar</button>
    <button class="download" onclick="downloadNotice()">⇩</button>
   </div>
  </div>
 </article>`;
}

async function loadProducts(){
 const container = document.getElementById('products');

 const {data, error} = await supabaseClient
  .from('products')
  .select('id,name,description,price,image_url,promo_price,published,created_at')
  .eq('published', true)
  .order('created_at', {ascending:true});

 if(error){
  console.error('Erro ao carregar produtos:', error);
  container.innerHTML = '<div class="status-message">Não foi possível carregar os produtos. Verifique as permissões da tabela no Supabase.</div>';
  return;
 }

 if(!data || data.length === 0){
  container.innerHTML = '<div class="status-message">Nenhum produto publicado foi encontrado.</div>';
  return;
 }

 container.innerHTML = data.map(renderProduct).join('');
}

function downloadNotice(){
 alert('O download será disponibilizado após a confirmação do pagamento pela loja.');
}

loadProducts();
</script>
</body>
</html>
