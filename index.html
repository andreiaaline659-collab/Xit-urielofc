<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090c">
<meta name="description" content="FREEARD OFC — produtos digitais. Confira os produtos disponíveis.">
<title>FREEARD OFC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  /* Roxo continua sendo a identidade; vermelho entra como destaque */
  --bg:#09090c;
  --surface:#111116;
  --surface-2:#17171d;
  --line:rgba(151,105,180,.25);
  --purple:#8500dc;
  --purple-light:#a33bea;
  --red:#e32636;
  --red-dark:#a91020;
  --text:#f5f3f7;
  --muted:#aaa5b0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--text);
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:
    radial-gradient(ellipse at 8% 0%,rgba(125,0,190,.12),transparent 34rem),
    radial-gradient(ellipse at 100% 42%,rgba(210,25,45,.07),transparent 30rem),
    var(--bg);
  background-attachment:fixed;
}
button{font:inherit}
.announcement{
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:7px 12px;
  color:#fff;
  background:linear-gradient(90deg,#6500a8 0%,#8200c8 48%,#6500a8 100%);
  border-bottom:1px solid rgba(255,255,255,.08);
  font-size:10px;
  font-weight:800;
  letter-spacing:.35px;
  line-height:1.45;
  text-align:center;
}
header{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  max-width:1160px;
  margin:auto;
  padding:12px 16px;
  background:rgba(9,9,12,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.header-shell{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(9,9,12,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.header-shell header{position:static;border:0;background:transparent;backdrop-filter:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{
  width:42px;height:42px;flex:0 0 42px;
  border-radius:10px;overflow:hidden;
  border:1px solid rgba(255,255,255,.13);
  background:#17121d;
}
.avatar img{display:block;width:100%;height:100%;object-fit:cover}
.brand-name{
  display:flex;align-items:center;gap:7px;
  white-space:nowrap;font-size:16px;font-weight:900;letter-spacing:.15px;
}
.verified-badge{display:block;width:18px;height:18px;flex:0 0 18px}
.brand-sub{margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:.3px}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-button,.login-button{
  min-width:42px;height:42px;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.11);
  border-radius:12px;color:#f7f4fa;background:#141319;
  text-decoration:none;cursor:pointer;
  transition:border-color .2s,background .2s,transform .2s;
}
.icon-button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-button:hover,.login-button:hover{border-color:rgba(163,59,234,.7);background:#1b1721}
.cart-button{border-color:rgba(133,0,220,.45);color:#d7a6ff}
.login-button{min-width:76px;padding:0 14px;font-size:12px;font-weight:800}
main{max-width:1160px;margin:auto;padding:28px 16px 44px}
.intro{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:12px;margin:0 2px 18px;
}
.section-heading{min-width:0}
.section-heading h2{
  margin:0;font-size:clamp(18px,3vw,25px);font-weight:900;
  text-transform:uppercase;line-height:1.25;letter-spacing:.1px;
}
.section-heading p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
.section-mark{
  width:42px;height:3px;margin-top:12px;border-radius:9px;
  background:linear-gradient(90deg,var(--red),var(--purple));
}
.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.card{
  min-width:0;overflow:hidden;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(160deg,rgba(24,20,29,.98),rgba(13,13,17,.98) 72%);
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.card:hover{
  transform:translateY(-2px);
  border-color:rgba(163,59,234,.55);
  box-shadow:0 12px 28px rgba(0,0,0,.32),0 0 18px rgba(133,0,220,.08);
}
.image-wrap{
  position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;
  background:#17131b;border-bottom:1px solid rgba(255,255,255,.07);
}
.product-image{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover .product-image{transform:scale(1.025)}
.image-placeholder{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;padding:12px;text-align:center;
  background:radial-gradient(circle at 50% 35%,#351344,#111 72%);
}
.image-placeholder[hidden]{display:none}
.placeholder-symbol{font-size:28px}
.image-placeholder strong{font-size:12px;overflow-wrap:anywhere}
.image-placeholder small{color:#d4a7ee;font-size:9px;letter-spacing:1px}
.info{padding:12px}
.name{
  min-height:36px;font-size:13px;font-weight:800;line-height:1.4;
  overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.description{
  min-height:32px;margin-top:6px;color:var(--muted);font-size:11px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.old{margin-top:10px;color:#928d98;text-decoration:line-through;font-size:11px}
.discount{
  display:inline-block;margin-left:7px;padding:3px 7px;
  border:1px solid rgba(227,38,54,.28);border-radius:6px;
  color:#ff9aa3;background:rgba(227,38,54,.10);
  font-size:9px;font-weight:800;text-decoration:none;
}
.price{
  margin-top:6px;color:#ff5967;font-size:19px;font-weight:900;
  letter-spacing:.1px;
}
.pix{margin-top:3px;color:var(--muted);font-size:10px}
.buttons{display:flex;gap:8px;margin-top:13px}
.buy{
  min-height:42px;flex:1;min-width:0;
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid rgba(255,255,255,.08);border-radius:9px;
  color:#fff;background:linear-gradient(105deg,#b91529,#e32636 58%,#c51a2d);
  box-shadow:0 4px 13px rgba(180,20,40,.17);
  font-size:12px;font-weight:900;cursor:pointer;
  transition:filter .2s,transform .2s,box-shadow .2s;
}
.buy svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.buy:hover{filter:brightness(1.09);box-shadow:0 6px 16px rgba(180,20,40,.25)}
.buy:active{transform:scale(.985)}
.status-message{
  grid-column:1/-1;padding:28px 14px;color:var(--muted);text-align:center;
  border:1px dashed rgba(163,59,234,.35);border-radius:12px;
  background:rgba(20,16,25,.6);font-size:12px;line-height:1.5;
}
footer{
  padding:24px 14px;color:#89838f;text-align:center;
  font-size:11px;line-height:1.6;border-top:1px solid rgba(255,255,255,.07);
}
@media(min-width:700px){
  main{padding-top:36px}
  .products{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
  .info{padding:14px}
  .name{font-size:14px}
  .description{font-size:12px}
  .price{font-size:21px}
  .buy{min-height:45px;font-size:13px}
}
@media(min-width:1000px){
  .products{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
}
@media(max-width:390px){
  header{padding:9px 10px}
  .avatar{width:36px;height:36px;flex-basis:36px}
  .brand{gap:7px}
  .brand-name{font-size:13px;gap:5px}
  .verified-badge{width:16px;height:16px;flex-basis:16px}
  .header-actions{gap:5px}
  .icon-button,.login-button{height:36px;min-width:36px;border-radius:10px}
  .login-button{min-width:60px;padding:0 9px;font-size:10px}
  main{padding:22px 11px 34px}
  .products{gap:10px}
  .info{padding:8px}
  .name{font-size:11px;min-height:31px}
  .description{font-size:9.5px;min-height:27px}
  .old{font-size:9px}
  .discount{font-size:8px;padding:2px 5px}
  .price{font-size:15px}
  .pix{font-size:9px}
  .buy{min-height:36px;font-size:10px;gap:5px}
  .buy svg{width:15px;height:15px;flex-basis:15px}
  .section-heading h2{font-size:18px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>

<div class="announcement">
  VENDEDOR VERIFICADO • TODOS OS XIT SÃO PERMANENTES!<br>
  SE NÃO FUNCIONAR, REEMBOLSO DO DINHEIRO!
</div>

<div class="header-shell">
<header>
  <div class="brand">
    <div class="avatar">
      <img src="https://i.postimg.cc/9FFyk8pg/Screenshot-2026-11-14-22-33-09-484-com-instagram-android.jpg" alt="FREEARD OFC">
    </div>
    <div>
      <div class="brand-name">FREEARD OFC
        <svg class="verified-badge" viewBox="0 0 48 48" role="img" aria-label="Verificado">
          <path d="M24 2 L29 7 L36 5 L39 12 L46 16 L43 24 L46 32 L39 36 L36 43 L29 41 L24 46 L19 41 L12 43 L9 36 L2 32 L5 24 L2 16 L9 12 L12 5 L19 7 Z" fill="#1877F2"/>
          <path d="M14 24 L21 31 L35 17" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-sub">LOJA DE PRODUTOS DIGITAIS</div>
    </div>
  </div>

  <div class="header-actions">
    <button class="icon-button" type="button" aria-label="Pesquisar" onclick="searchNotice()">
      <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
    </button>
    <button class="icon-button cart-button" type="button" aria-label="Carrinho" onclick="cartNotice()">
      <svg viewBox="0 0 24 24">
        <path d="M2.5 3h2l2.2 11.1a2 2 0 0 0 2 1.6h9.1a2 2 0 0 0 1.9-1.5L21.5 7H5.5"/>
        <circle cx="9.5" cy="19.5" r="1.3"/><circle cx="18" cy="19.5" r="1.3"/>
      </svg>
    </button>
    <button class="login-button" type="button" onclick="alert('Área de login em breve!')">Entrar</button>
  </div>
</header>
</div>

<main>
  <div class="intro">
    <div class="section-heading">
      <h2>👇 ANDROID HS SAFE PARA PRINCIPAL 👇</h2>
      <p>Confira os produtos disponíveis e escolha o seu.</p>
      <div class="section-mark"></div>
    </div>
  </div>

  <section class="products" id="products" aria-live="polite">
    <div class="status-message">Carregando produtos...</div>
  </section>
</main>

<footer>© 2026 FREEARD OFC — Todos os direitos reservados.</footer>

<script>
const SUPABASE_URL = 'https://uvmlovadmbyiuvjogepv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4eUg8dwrnmVZCcCQiEANvA_DgXwvOST';
const PIX_URL = 'https://nubank.com.br/cobrar/3d51nu/6b099831-ee8a-412b-8c7b-4e7ea8e34379';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[char]));
}

function formatPrice(value){
  const number = Number(value);
  if(!Number.isFinite(number)) return 'Consulte';
  return number.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}

function openPix(){
  window.location.href = PIX_URL;
}

function searchNotice(){
  alert('A pesquisa será disponibilizada em breve!');
}

function cartNotice(){
  alert('O carrinho está disponível visualmente. A função de carrinho ainda precisa ser integrada.');
}

function renderProduct(product){
  const price = Number(product.price);
  const promo = product.promo_price == null ? null : Number(product.promo_price);
  const hasPromo = Number.isFinite(promo) && promo > 0 && Number.isFinite(price) && promo < price;
  const name = escapeHTML(product.name);
  const description = escapeHTML(product.description);

  const image = product.image_url
    ? `<div class="image-wrap">
         <img class="product-image" src="${escapeHTML(product.image_url)}" alt="${name}" loading="lazy"
           onerror="this.hidden=true;this.nextElementSibling.hidden=false">
         <div class="image-placeholder" hidden><span class="placeholder-symbol">⚡</span><strong>${name}</strong><small>FREEARD OFC</small></div>
       </div>`
    : `<div class="image-wrap"><div class="image-placeholder"><span class="placeholder-symbol">⚡</span><strong>${name}</strong><small>FREEARD OFC</small></div></div>`;

  const oldPrice = hasPromo
    ? `<div class="old">${formatPrice(price)}<span class="discount">-${Math.round((1-promo/price)*100)}%</span></div>`
    : '';

  const displayedPrice = hasPromo ? promo : price;

  return `<article class="card">
    ${image}
    <div class="info">
      <div class="name">${name}</div>
      ${description ? `<div class="description">${description}</div>` : '<div class="description"></div>'}
      ${oldPrice}
      <div class="price">${formatPrice(displayedPrice)}</div>
      <div class="pix">À vista no PIX</div>
      <div class="buttons">
        <button class="buy" type="button" onclick="openPix()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.5L22 8H6"/>
            <circle cx="10" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/>
          </svg>
          Comprar agora
        </button>
      </div>
    </div>
  </article>`;
}

async function loadProducts(){
  const container = document.getElementById('products');

  const {data, error} = await supabaseClient
    .from('products')
    .select('id,name,description,price,image_url,promo_price,published,created_at')
    .eq('published', true)
    .order('created_at', {ascending:true});

  if(error){
    console.error('Erro ao carregar produtos:', error);
    container.innerHTML = '<div class="status-message">Não foi possível carregar os produtos. Verifique as permissões da tabela no Supabase.</div>';
    return;
  }

  if(!data || data.length === 0){
    container.innerHTML = '<div class="status-message">Nenhum produto publicado foi encontrado.</div>';
    return;
  }

  container.innerHTML = data.map(renderProduct).join('');
}

loadProducts();
</script>
</body>
</html>
