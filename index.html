
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090c">
<meta name="description" content="FREEARD OFC — Loja de produtos digitais.">
<title>FREEARD OFC</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#08080b;
  --surface:#101014;
  --surface2:#15151b;
  --line:rgba(255,255,255,.09);
  --purple:#7800bd;
  --red:#e51c30;
  --red-dark:#b51225;
  --text:#f5f3f7;
  --muted:#99949f;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  color:var(--text);
  background:var(--bg);
  font-family:Inter,Arial,Helvetica,sans-serif;
}

button{
  font:inherit;
}

/* AVISO SUPERIOR */

.announcement{
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px 10px;
  text-align:center;
  color:#fff;
  background:linear-gradient(100deg,#a20d21,#e51c30,#a20d21);
  font-size:10px;
  font-weight:800;
  line-height:1.5;
  letter-spacing:.3px;
}

/* CABEÇALHO */

.header-shell{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(8,8,11,.96);
  border-bottom:1px solid rgba(229,28,48,.20);
  backdrop-filter:blur(14px);
}

header{
  max-width:1160px;
  margin:auto;
  padding:9px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.avatar{
  width:35px;
  height:35px;
  flex:0 0 35px;
  border-radius:9px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#15151b;
}

.avatar img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.brand-name{
  display:flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
  font-size:14px;
  font-weight:900;
}

.verified-badge{
  width:16px;
  height:16px;
  flex:0 0 16px;
}

.brand-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:8px;
  letter-spacing:.35px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.icon-button,
.login-button{
  width:37px;
  height:37px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.11);
  border-radius:10px;
  color:white;
  background:#111116;
  cursor:pointer;
  transition:.2s;
}

.icon-button svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon-button:hover{
  border-color:var(--red);
}

.cart-button{
  color:#fff;
  background:var(--red);
  border-color:var(--red);
}

.cart-button:hover{
  background:var(--red-dark);
}

.login-button{
  width:auto;
  min-width:65px;
  padding:0 12px;
  font-size:11px;
  font-weight:800;
}

/* CONTEÚDO */

main{
  max-width:1160px;
  margin:auto;
  padding:19px 14px 30px;
}

.intro{
  margin:0 2px 15px;
}

.section-heading h2{
  margin:0;
  font-size:clamp(15px,2.5vw,20px);
  font-weight:900;
  line-height:1.35;
  text-transform:uppercase;
}

.section-heading p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:11px;
}

.section-mark{
  width:43px;
  height:3px;
  margin-top:11px;
  border-radius:10px;
  background:linear-gradient(90deg,var(--red),var(--purple));
}

/* GRADE DE PRODUTOS */

.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

/* CARTÃO */

.card{
  min-width:0;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  background:linear-gradient(145deg,#111116,#0b0b0f);
  transition:border-color .2s;
}

.card:hover{
  border-color:rgba(229,28,48,.55);
}

/* IMAGENS */

.image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#17131b;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.product-image{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .3s;
}

.card:hover .product-image{
  transform:scale(1.025);
}

.image-placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:7px;
  padding:10px;
  text-align:center;
  background:radial-gradient(circle,#32133c,#101014 75%);
}

.image-placeholder[hidden]{
  display:none;
}

.placeholder-symbol{
  font-size:25px;
}

.image-placeholder strong{
  font-size:11px;
  overflow-wrap:anywhere;
}

.image-placeholder small{
  color:#d4a7ee;
  font-size:9px;
}

/* INFORMAÇÕES */

.info{
  padding:9px;
}

.name{
  min-height:27px;
  font-size:11px;
  font-weight:800;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  overflow-wrap:anywhere;
}

.description{
  min-height:32px;
  margin-top:4px;
  color:var(--muted);
  font-size:9px;
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.old{
  margin-top:7px;
  color:#918c96;
  font-size:9px;
  text-decoration:line-through;
}

.discount{
  display:inline-block;
  margin-left:5px;
  padding:3px 6px;
  border-radius:6px;
  color:#ff929b;
  background:rgba(229,28,48,.12);
  border:1px solid rgba(229,28,48,.22);
  font-size:8px;
  font-weight:800;
  text-decoration:none;
}

/* PREÇO */

.price{
  margin-top:5px;
  color:#f02d40;
  font-size:15px;
  font-weight:850;
  letter-spacing:.1px;
}

.pix{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

/* BOTÃO COMPRAR */

.buttons{
  display:flex;
  margin-top:10px;
}

.buy{
  width:100%;
  min-height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:8px;
  color:white;
  background:linear-gradient(100deg,#bd1529,#ed2639);
  font-size:10px;
  font-weight:850;
  cursor:pointer;
  transition:filter .2s,transform .2s;
}

.buy svg{
  width:16px;
  height:16px;
  flex:0 0 16px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.buy:hover{
  filter:brightness(1.12);
}

.buy:active{
  transform:scale(.98);
}

.status-message{
  grid-column:1/-1;
  padding:25px 14px;
  color:var(--muted);
  text-align:center;
  border:1px dashed rgba(255,255,255,.15);
  border-radius:12px;
  font-size:12px;
}

/* RODAPÉ */

footer{
  padding:25px 14px;
  color:#89838f;
  text-align:center;
  font-size:11px;
  line-height:1.6;
  border-top:1px solid var(--line);
}

/* CELULARES */

@media(max-width:480px){

  header{
    padding:8px 10px;
  }

  .avatar{
    width:34px;
    height:34px;
    flex-basis:34px;
  }

  .brand-name{
    font-size:12px;
  }

  .brand-sub{
    font-size:7px;
  }

  .header-actions{
    gap:5px;
  }

  .icon-button,
  .login-button{
    height:34px;
    min-width:34px;
    border-radius:9px;
  }

  .login-button{
    min-width:57px;
    font-size:10px;
    padding:0 8px;
  }

  .icon-button svg{
    width:17px;
    height:17px;
  }

  main{
    padding:17px 11px 25px;
  }

  .products{
    gap:10px;
  }

  .info{
    padding:8px;
  }

  .name{
    font-size:10px;
  }

  .description{
    font-size:8.5px;
  }

  .price{
    font-size:14px;
  }

  .old{
    font-size:8px;
  }

  .discount{
    font-size:7px;
    padding:2px 5px;
  }

  .pix{
    font-size:8px;
  }

  .buy{
    min-height:33px;
    font-size:9px;
    gap:6px;
  }

  .buy svg{
    width:15px;
    height:15px;
    flex-basis:15px;
  }

  .section-heading h2{
    font-size:16px;
  }
}

/* TELAS MAIORES */

@media(min-width:700px){
  .products{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
  }

  .info{
    padding:12px;
  }

  .name{
    font-size:13px;
  }

  .description{
    font-size:11px;
  }

  .price{
    font-size:17px;
  }

  .buy{
    min-height:39px;
    font-size:11px;
  }
}

@media(min-width:1000px){
  .products{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>

<div class="announcement">
  VENDEDOR VERIFICADO • TODOS OS XIT SÃO PERMANENTES!
  <br>
  SE NÃO FUNCIONAR, REEMBOLSO DO DINHEIRO!
</div>

<div class="header-shell">
<header>

  <div class="brand">

    <div class="avatar">
      <img
        src="https://i.postimg.cc/9FFyk8pg/Screenshot-2026-11-14-22-33-09-484-com-instagram-android.jpg"
        alt="FREEARD OFC">
    </div>

    <div>
      <div class="brand-name">
        FREEARD OFC

        <svg class="verified-badge" viewBox="0 0 48 48">
          <path d="M24 2 L29 7 L36 5 L39 12 L46 16 L43 24 L46 32 L39 36 L36 43 L29 41 L24 46 L19 41 L12 43 L9 36 L2 32 L5 24 L2 16 L9 12 L12 5 L19 7 Z" fill="#1877F2"/>
          <path d="M14 24 L21 31 L35 17" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="brand-sub">
        LOJA DE PRODUTOS DIGITAIS
      </div>
    </div>

  </div>

  <div class="header-actions">

    <button class="icon-button" type="button" aria-label="Pesquisar" onclick="searchNotice()">
      <svg viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.8"/>
        <path d="m16 16 5 5"/>
      </svg>
    </button>

    <button class="icon-button cart-button" type="button" aria-label="Sacola" onclick="cartNotice()">
      <svg viewBox="0 0 24 24">
        <path d="M5 8h14l1 13H4L5 8Z"/>
        <path d="M9 9V6a3 3 0 0 1 6 0v3"/>
      </svg>
    </button>

    <button class="login-button" type="button" onclick="alert('Área de login em breve!')">
      Entrar
    </button>

  </div>

</header>
</div>

<main>

  <div class="intro">
    <div class="section-heading">
      <h2>👇 ANDROID HS SAFE PARA PRINCIPAL 👇</h2>
      <p>Confira os produtos disponíveis e escolha o seu.</p>
      <div class="section-mark"></div>
    </div>
  </div>

  <section class="products" id="products" aria-live="polite">
    <div class="status-message">Carregando produtos...</div>
  </section>

</main>

<footer>
  © 2026 FREEARD OFC — Todos os direitos reservados.
</footer>

<script>
const SUPABASE_URL = 'https://uvmlovadmbyiuvjogepv.supabase.co';

const SUPABASE_KEY = 'sb_publishable_4eUg8dwrnmVZCcCQiEANvA_DgXwvOST';

const PIX_URL = 'https://nubank.com.br/cobrar/3d51nu/6b099831-ee8a-412b-8c7b-4e7ea8e34379';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[char]));
}

function formatPrice(value){
  const number = Number(value);

  if(!Number.isFinite(number)){
    return 'Consulte';
  }

  return number.toLocaleString('pt-BR',{
    style:'currency',
    currency:'BRL'
  });
}

function openPix(){
  window.location.href = PIX_URL;
}

function searchNotice(){
  alert('A pesquisa será disponibilizada em breve!');
}

function cartNotice(){
  alert('A sacola visual está pronta. A integração do carrinho ainda precisa ser feita.');
}

function renderProduct(product){

  const price = Number(product.price);

  const promo = product.promo_price == null
    ? null
    : Number(product.promo_price);

  const hasPromo =
    Number.isFinite(promo) &&
    promo > 0 &&
    Number.isFinite(price) &&
    promo < price;

  const name = escapeHTML(product.name);

  const description = escapeHTML(product.description);

  const image = product.image_url
    ? `
      <div class="image-wrap">
        <img
          class="product-image"
          src="${escapeHTML(product.image_url)}"
          alt="${name}"
          loading="lazy"
          onerror="this.hidden=true;this.nextElementSibling.hidden=false">

        <div class="image-placeholder" hidden>
          <span class="placeholder-symbol">⚡</span>
          <strong>${name}</strong>
          <small>FREEARD OFC</small>
        </div>
      </div>
    `
    : `
      <div class="image-wrap">
        <div class="image-placeholder">
          <span class="placeholder-symbol">⚡</span>
          <strong>${name}</strong>
          <small>FREEARD OFC</small>
        </div>
      </div>
    `;

  const oldPrice = hasPromo
    ? `
      <div class="old">
        ${formatPrice(price)}
        <span class="discount">
          -${Math.round((1-promo/price)*100)}%
        </span>
      </div>
    `
    : '';

  const displayedPrice = hasPromo ? promo : price;

  return `
    <article class="card">

      ${image}

      <div class="info">

        <div class="name">${name}</div>

        ${
          description
          ? `<div class="description">${description}</div>`
          : '<div class="description"></div>'
        }

        ${oldPrice}

        <div class="price">
          ${formatPrice(displayedPrice)}
        </div>

        <div class="pix">
          À vista no PIX
        </div>

        <div class="buttons">

          <button class="buy" type="button" onclick="openPix()">

            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8h14l1 13H4L5 8Z"/>
              <path d="M9 9V6a3 3 0 0 1 6 0v3"/>
            </svg>

            Comprar agora

          </button>

        </div>

      </div>

    </article>
  `;
}

async function loadProducts(){

  const container = document.getElementById('products');

  const {data, error} = await supabaseClient
    .from('products')
    .select('id,name,description,price,image_url,promo_price,published,created_at')
    .eq('published', true)
    .order('created_at', {ascending:true});

  if(error){

    console.error('Erro ao carregar produtos:', error);

    container.innerHTML = `
      <div class="status-message">
        Não foi possível carregar os produtos.
        Verifique as permissões da tabela no Supabase.
      </div>
    `;

    return;
  }

  if(!data || data.length === 0){

    container.innerHTML = `
      <div class="status-message">
        Nenhum produto publicado foi encontrado.
      </div>
    `;

    return;
  }

  container.innerHTML = data.map(renderProduct).join('');
}

loadProducts();
</script>

</body>
</html>
