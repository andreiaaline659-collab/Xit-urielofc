<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090c">
<meta name="description" content="FREEARD OFC — Loja de produtos digitais.">
<title>FREEARD OFC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#08080b;
  --surface:#101014;
  --line:rgba(255,255,255,.09);
  --red:#d71930;
  --red-dark:#b51225;
  --text:#f5f3f7;
  --muted:#99949f;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--text);
  background:var(--bg);
  font-family:Inter,Arial,Helvetica,sans-serif;
}
button{font:inherit}

/* AVISO SUPERIOR */
.announcement{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:7px 12px;
  text-align:center;
  color:#fff;
  background:linear-gradient(100deg,#a20d21,#d71930,#a20d21);
  font-size:10px;
  font-weight:800;
  line-height:1.45;
  letter-spacing:.2px;
}
.announcement-seal{
  width:19px;
  height:19px;
  flex:0 0 19px;
}

/* CABEÇALHO */
.header-shell{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(8,8,11,.97);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
}
header{
  max-width:1160px;
  margin:auto;
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.brand{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}
.avatar{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:9px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#15151b;
}
.avatar img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}
.brand-name{
  display:flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
  font-size:14px;
  font-weight:900;
}
.verified-badge{
  width:17px;
  height:17px;
  flex:0 0 17px;
}
.brand-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:8px;
  letter-spacing:.35px;
}
.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}
.icon-button,.login-button{
  width:39px;
  height:39px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.11);
  border-radius:10px;
  color:#fff;
  background:#111116;
  cursor:pointer;
  transition:.2s;
}
.icon-button svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.icon-button:hover{border-color:var(--red)}
.cart-button{
  color:#fff;
  background:var(--red);
  border-color:var(--red);
}
.cart-button:hover{background:var(--red-dark)}
.login-button{
  width:auto;
  min-width:70px;
  padding:0 13px;
  font-size:11px;
  font-weight:800;
}

/* CONTEÚDO */
main{
  max-width:1160px;
  margin:auto;
  padding:20px 14px 32px;
}
.intro{margin:0 2px 16px}
.section-heading h2{
  margin:0;
  font-size:clamp(16px,2.5vw,21px);
  font-weight:850;
  line-height:1.35;
  text-transform:uppercase;
}
.section-heading p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:11px;
}
.section-mark{
  width:42px;
  height:3px;
  margin-top:11px;
  border-radius:10px;
  background:var(--red);
}

/* PRODUTOS */
.products{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}
.card{
  min-width:0;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  border-radius:13px;
  background:#0e0e12;
  transition:border-color .2s;
}
.card:hover{
  border-color:rgba(215,25,48,.45);
}
.image-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1.82/1;
  overflow:hidden;
  background:#17131b;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.product-image{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}
.image-placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:7px;
  padding:10px;
  text-align:center;
  background:radial-gradient(circle,#32133c,#101014 75%);
}
.image-placeholder[hidden]{display:none}
.placeholder-symbol{font-size:25px}
.image-placeholder strong{
  font-size:11px;
  overflow-wrap:anywhere;
}
.image-placeholder small{
  color:#d4a7ee;
  font-size:9px;
}

/* INFORMAÇÕES */
.info{
  padding:10px 10px 10px;
  display:flex;
  flex-direction:column;
  min-height:158px;
}
.name{
  min-height:2.65em;
  font-size:11px;
  font-weight:800;
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  overflow-wrap:anywhere;
  text-transform:uppercase;
}

/* PREÇO ANTIGO E DESCONTO */
.price-line{
  min-height:19px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}
.old{
  color:#85818a;
  font-size:9px;
  text-decoration:line-through;
}
.discount{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:2px 6px;
  border-radius:6px;
  color:#8de0b7;
  background:rgba(30,170,112,.10);
  border:1px solid rgba(30,170,112,.27);
  font-size:8px;
  font-weight:800;
  text-decoration:none;
}
.discount svg{
  width:9px;
  height:9px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* PREÇO FINAL MAIS DISCRETO */
.price{
  margin-top:3px;
  color:#f0eef2;
  font-size:14px;
  font-weight:800;
  letter-spacing:0;
}
.pix{
  margin-top:3px;
  color:#96919b;
  font-size:9px;
}

/* BOTÃO DE COMPRA */
.buttons{
  display:flex;
  margin-top:auto;
  padding-top:11px;
}
.buy{
  width:100%;
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid rgba(255,255,255,.06);
  border-radius:7px;
  color:#fff;
  background:linear-gradient(100deg,#b9152a,#df1d33);
  font-size:10px;
  font-weight:800;
  cursor:pointer;
  transition:filter .2s,transform .2s;
}
.buy svg{
  width:18px;
  height:18px;
  flex:0 0 18px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.buy:hover{filter:brightness(1.12)}
.buy:active{transform:scale(.98)}

.status-message{
  grid-column:1/-1;
  padding:25px 14px;
  color:var(--muted);
  text-align:center;
  border:1px dashed rgba(255,255,255,.15);
  border-radius:12px;
  font-size:12px;
}
footer{
  padding:25px 14px;
  color:#89838f;
  text-align:center;
  font-size:10px;
  line-height:1.6;
  border-top:1px solid var(--line);
}

/* CELULAR */
@media(max-width:480px){
  .announcement{
    min-height:42px;
    font-size:10px;
    gap:8px;
    padding:6px 9px;
  }
  .announcement-seal{
    width:19px;
    height:19px;
    flex-basis:19px;
  }
  header{padding:8px 10px}
  .avatar{
    width:35px;
    height:35px;
    flex-basis:35px;
  }
  .brand-name{font-size:12px}
  .brand-sub{font-size:7px}
  .header-actions{gap:5px}
  .icon-button,.login-button{
    height:35px;
    min-width:35px;
    border-radius:9px;
  }
  .login-button{
    min-width:57px;
    font-size:10px;
    padding:0 8px;
  }
  .icon-button svg{
    width:18px;
    height:18px;
  }
  main{padding:17px 11px 26px}
  .products{gap:10px}
  .info{
    min-height:153px;
    padding:9px;
  }
  .name{
    font-size:10.5px;
    min-height:2.7em;
  }
  .price-line{
    margin-top:7px;
    gap:4px;
  }
  .old{font-size:9px}
  .discount{
    font-size:8px;
    padding:2px 5px;
  }
  .price{font-size:13px}
  .pix{font-size:9px}
  .buy{
    min-height:35px;
    font-size:10px;
    gap:6px;
  }
  .buy svg{
    width:17px;
    height:17px;
    flex-basis:17px;
  }
  .section-heading h2{font-size:16px}
}

/* TABLETS E COMPUTADORES */
@media(min-width:700px){
  .products{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
  }
  .info{
    min-height:165px;
    padding:12px;
  }
  .name{font-size:12px}
  .old{font-size:10px}
  .price{font-size:15px}
  .buy{
    min-height:39px;
    font-size:11px;
  }
}
@media(min-width:1000px){
  .products{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
