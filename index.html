<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>FREEARD OFC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080808;--surface:#101014;--surface-2:#17171c;--line:#29252b;--red:#ed101c;--red2:#a90012;--text:#f5f5f7;--muted:#aaa6ad}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 12% 15%,rgba(220,0,25,.13),transparent 18rem),radial-gradient(circle at 90% 55%,rgba(220,0,25,.09),transparent 22rem),radial-gradient(circle at 30% 85%,rgba(180,0,20,.08),transparent 20rem),var(--bg);background-attachment:fixed}
.announcement{min-height:34px;display:flex;align-items:center;justify-content:center;padding:6px 10px;color:white;background:linear-gradient(90deg,#79000d,#d90018,#79000d);font-size:10px;font-weight:800;letter-spacing:.35px;line-height:1.4;text-align:center}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px max(12px,calc((100% - 1050px)/2));background:rgba(8,8,10,.97);border-bottom:1px solid rgba(220,0,25,.65);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}.avatar{width:31px;height:31px;flex:0 0 31px;border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}.avatar img{display:block;width:100%;height:100%;object-fit:cover}.brand-name{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px;font-weight:900;letter-spacing:.1px}.verified-badge{display:block;width:16px;height:16px;flex:0 0 16px}.brand-sub{display:none}.header-actions{display:flex;align-items:center;gap:6px}
.icon-button,.login-button{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #30272c;border-radius:9px;color:white;background:#111114;text-decoration:none;cursor:pointer}.icon-button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.bag-button{color:#fff;background:linear-gradient(135deg,#9200ed,#6500bd);border:1px solid #9200ed}.bag-button svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.login-button{width:auto;padding:0 11px;font-size:11px;font-weight:800}
main{max-width:1050px;margin:auto;padding:17px 12px 30px}.section-heading{display:flex;align-items:center;gap:8px;margin:4px 0 15px}.section-heading h2{margin:0;font-size:18px;font-weight:900;text-transform:uppercase;line-height:1.2}.section-heading span{display:none}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{min-width:0;overflow:hidden;border:1px solid rgba(210,20,35,.65);border-radius:11px;background:linear-gradient(180deg,#121215,#0b0b0d);box-shadow:0 5px 17px rgba(0,0,0,.35)}.image-wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#171014;border-bottom:1px solid rgba(210,20,35,.55)}.product-image{display:block;width:100%;height:100%;object-fit:cover}.image-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;padding:12px;text-align:center;background:radial-gradient(circle at 50% 35%,#68101b,#111 70%)}.image-placeholder[hidden]{display:none}.placeholder-symbol{font-size:27px}.image-placeholder strong{font-size:11px;overflow-wrap:anywhere}.image-placeholder small{color:#d4a6aa;font-size:9px;letter-spacing:1px}
.info{padding:8px}.name{min-height:30px;font-size:11px;font-weight:800;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.description{margin-top:4px;color:var(--muted);font-size:9px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.old{margin-top:8px;color:#99949a;text-decoration:line-through;font-size:10px}.discount{display:inline-block;margin-left:4px;padding:3px 5px;border-radius:5px;color:#55e5a3;background:#073522;font-size:9px;font-weight:800;text-decoration:none}.price{margin-top:5px;color:#ff2635;font-size:16px;font-weight:900}.pix{margin-top:4px;color:var(--muted);font-size:9px}.buttons{display:flex;gap:6px;margin-top:8px}.buy{min-height:34px;width:100%;border:0;border-radius:6px;color:#fff;background:linear-gradient(100deg,#b90013,#f01625);box-shadow:0 3px 10px rgba(220,0,25,.18);font-size:10px;font-weight:900;cursor:pointer;transition:filter .2s,transform .2s}.buy:hover{filter:brightness(1.12)}.buy:active{transform:scale(.98)}.status-message{grid-column:1/-1;padding:25px 12px;color:var(--muted);text-align:center;border:1px dashed #493039;border-radius:12px;font-size:12px}
footer{padding:22px 12px;color:var(--muted);text-align:center;font-size:11px;border-top:1px solid #302127}
@media(min-width:700px){.products{grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.info{padding:11px}.name{font-size:13px}.price{font-size:17px}.buy{min-height:39px;font-size:11px}}
@media(max-width:390px){header{padding:7px 10px}.brand-name{font-size:12px}.avatar{width:30px;height:30px;flex-basis:30px}.verified-badge{width:15px;height:15px;flex-basis:15px}.header-actions{gap:5px}.icon-button,.login-button{height:33px}.icon-button{width:33px}.login-button{padding:0 9px;font-size:10px}main{padding:15px 10px 28px}.products{gap:9px}.info{padding:7px}.name{font-size:10.5px}.price{font-size:15px}.buy{font-size:10px;min-height:33px}.section-heading h2{font-size:17px}}
</style>
</head>
<body>
<div class="announcement">VENDEDOR VERIFICADO • TODOS OS XIT SÃO PERMANENTES!<br>SE NÃO FUNCIONAR, REEMBOLSO DO DINHEIRO!</div>
<header>
<div class="brand"><div class="avatar"><img src="https://i.postimg.cc/9FFyk8pg/Screenshot-2026-11-14-22-33-09-484-com-instagram-android.jpg" alt="FREEARD OFC"></div><div><div class="brand-name">FREEARD OFC<svg class="verified-badge" viewBox="0 0 48 48" role="img" aria-label="Verificado"><path d="M24 2 L29 7 L36 5 L39 12 L46 16 L43 24 L46 32 L39 36 L36 43 L29 41 L24 46 L19 41 L12 43 L9 36 L2 32 L5 24 L2 16 L9 12 L12 5 L19 7 Z" fill="#1877F2"/><path d="M14 24 L21 31 L35 17" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div></div>
<div class="header-actions"><button class="icon-button" type="button" aria-label="Pesquisar" onclick="searchNotice()"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button><button class="icon-button bag-button" type="button" aria-label="Carrinho de compras" onclick="cartNotice()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 3.5h2l2.4 12a2 2 0 0 0 2 1.6h9.4a2 2 0 0 0 1.9-1.5L21.5 8H5.2"/><path d="M8 8h13"/><circle cx="9.5" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg></button><button class="login-button" type="button" onclick="alert('Área de login em breve!')">Entrar</button></div>
</header>
<main><div class="section-heading"><h2>👇 ANDROID HS SAFE PARA PRINCIPAL 👇</h2><span>Ofertas disponíveis</span></div><section class="products" id="products"><div class="status-message">Carregando produtos...</div></section></main>
<footer>© 2026 FREEARD OFC — Todos os direitos reservados.</footer>
<script>
const SUPABASE_URL='https://uvmlovadmbyiuvjogepv.supabase.co';
const SUPABASE_KEY='sb_publishable_4eUg8dwrnmVZCcCQiEANvA_DgXwvOST';
const PIX_URL='https://nubank.com.br/cobrar/3d51nu/6b099831-ee8a-412b-8c7b-4e7ea8e34379';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function formatPrice(value){return Number(value).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function openPix(){window.location.href=PIX_URL;}
function searchNotice(){alert('A pesquisa será disponibilizada em breve!');}
function cartNotice(){alert('O carrinho está disponível visualmente. A função de carrinho ainda precisa ser integrada.');}
function renderProduct(product){const price=Number(product.price);const promo=product.promo_price==null?null:Number(product.promo_price);const hasPromo=promo!==null&&promo>0&&promo<price;const name=escapeHTML(product.name);const description=escapeHTML(product.description);const image=product.image_url?`<div class="image-wrap"><img class="product-image" src="${escapeHTML(product.image_url)}" alt="${name}" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="image-placeholder" hidden><span class="placeholder-symbol">⚡</span><strong>${name}</strong><small>FREEARD OFC</small></div></div>`:`<div class="image-wrap"><div class="image-placeholder"><span class="placeholder-symbol">⚡</span><strong>${name}</strong><small>FREEARD OFC</small></div></div>`;const oldPrice=hasPromo?`<div class="old">${formatPrice(price)}<span class="discount">-${Math.round((1-promo/price)*100)}%</span></div>`:'';const displayedPrice=hasPromo?promo:price;return `<article class="card">${image}<div class="info"><div class="name">${name}</div>${description?`<div class="description">${description}</div>`:''}${oldPrice}<div class="price">${formatPrice(displayedPrice)}</div><div class="pix">À vista no PIX</div><div class="buttons"><button class="buy" type="button" onclick="openPix()">🛍 Comprar agora</button></div></div></article>`;}
async function loadProducts(){const container=document.getElementById('products');const {data,error}=await supabaseClient.from('products').select('id,name,description,price,image_url,promo_price,published,created_at').eq('published',true).order('created_at',{ascending:true});if(error){console.error('Erro ao carregar produtos:',error);container.innerHTML='<div class="status-message">Não foi possível carregar os produtos. Verifique as permissões da tabela no Supabase.</div>';return;}if(!data||data.length===0){container.innerHTML='<div class="status-message">Nenhum produto publicado foi encontrado.</div>';return;}container.innerHTML=data.map(renderProduct).join('');}
loadProducts();
</script>
</body>
</html>
